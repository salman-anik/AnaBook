name: Build Android APK & GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes"
        required: false
        default: "AnaBook v1.1.2 — In-App Updater with live APK progress download, automatic package installer launch, and post-installation cache cleanup."
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Assets & Tag
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Release APK not found at $APK_SRC"
            exit 1
          fi
          mkdir -p release_assets
          cp "$APK_SRC" "release_assets/AnaBook.apk"
          cp "$APK_SRC" "release_assets/AnaBook-${TAG}.apk"
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/AnaBook.apk "release_assets/AnaBook-${TAG}.apk" --clobber
          else
            gh release create "$TAG" release_assets/AnaBook.apk "release_assets/AnaBook-${TAG}.apk" \
              --title "AnaBook ${TAG}" \
              --notes "${NOTES:-AnaBook Release ${TAG}}"
          fi

      - name: Update app-version.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          node -e '
            const fs = require("fs");
            const manifest = {
              latestVersion: process.env.VERSION,
              versionCode: Number(process.env.VERSION_CODE),
              downloadUrl: "https://github.com/salman-anik/AnaBook/releases/latest",
              apkDownloadUrl: "https://github.com/salman-anik/AnaBook/releases/latest/download/AnaBook.apk",
              releaseNotes: process.env.NOTES || `AnaBook v${process.env.VERSION}`,
            };
            fs.writeFileSync("app-version.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-version.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): publish app-version.json for v${VERSION}"
            git pull --rebase --autostash origin main
            git push
          fi
